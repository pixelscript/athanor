# release-please keeps a "release PR" open that bumps version.txt and
# CHANGELOG.md from Conventional Commit messages (feat:, fix:, ...). Merging
# that PR tags the release; this workflow then builds the firmware at that tag
# and attaches athanor-vX.Y.Z.bin to the GitHub release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: recursive

      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Build
        run: |
          make libdaisy -j"$(nproc)"
          make -j"$(nproc)"
          make test

      - name: Attach firmware to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir -p dist
          cp build/athanor.bin "dist/athanor-${TAG}.bin"
          cp build/athanor.elf "dist/athanor-${TAG}.elf"
          (cd dist && sha256sum athanor-* > SHA256SUMS.txt)
          gh release upload "$TAG" dist/* --clobber
